services:
  - type: web
    name: shipzi-payments
    runtime: node
    region: oregon
    plan: free
    autoDeploy: true
    branch: main
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: ML_API_KEY
        sync: false
      - key: ML_BRIDGE_URL
        sync: false
      - key: NEXT_PUBLIC_ML_BRIDGE_URL
        sync: false
      - key: NEXT_PUBLIC_ML_BRIDGE_ENABLED
        value: "true"
  - type: web
    name: shipzi-ml-engine
    runtime: docker
    region: oregon
    plan: free
    autoDeploy: true
    branch: main
    dockerfilePath: ./backend/ml_bridge/Dockerfile.ml
    envVars:
      - key: PORT
        value: 5001
      - key: ML_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
